[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "kspr-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "bcrypt>=4.0.0",
  "PyJWT>=2.8.0",
  "pypdf>=5.0.0",
]
[project.optional-dependencies]
desktop = ["pyinstaller>=6.0.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "httpx>=0.27.0"]
[project.scripts]
kspr = "kspr_runtime:main"
[tool.setuptools]
py-modules = ["kspr_runtime"]
[tool.setuptools.packages.find]
where = ["backend"]
include = ["kspr_engine*"]
[tool.setuptools.package-data]
kspr_engine = ["licenses.json"]
