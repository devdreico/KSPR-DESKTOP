name: KSPR Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -e '.[desktop]'
      - name: Build Linux sidecar and installer
        run: |
          npm run desktop:sidecar
          npm run desktop:build
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: kspr-linux-x64
          path: desktop/src-tauri/target/release/bundle/deb/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -e '.[desktop]'
      - name: Build Windows sidecar and installer
        shell: pwsh
        run: |
          npm run desktop:sidecar
          npm run desktop:build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: kspr-windows-x64
          path: desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
