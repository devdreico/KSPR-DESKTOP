name: Build KSPR Desktop
on: { push: { tags: ["v*"] }, workflow_dispatch: {} }
jobs:
  bundle:
    strategy: { matrix: { os: [ubuntu-22.04, windows-latest] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: dtolnay/rust-toolchain@stable
        with: { target: x86_64-unknown-linux-gnu,x86_64-pc-windows-msvc }
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: python -m pip install -e . pyinstaller
      - run: pyinstaller --onefile --name kspr-runtime kspr_runtime.py
      - name: Stage Tauri sidecar
        shell: bash
        run: |
          mkdir -p desktop/src-tauri/binaries
          if [[ "$RUNNER_OS" == "Windows" ]]; then cp dist/kspr-runtime.exe desktop/src-tauri/binaries/kspr-runtime-x86_64-pc-windows-msvc.exe; else cp dist/kspr-runtime desktop/src-tauri/binaries/kspr-runtime-x86_64-unknown-linux-gnu; fi
      - run: npm install
      - run: npm run build
      - run: npx tauri build --config desktop/src-tauri/tauri.conf.json
      - name: Normalize release asset
        shell: bash
        run: |
          mkdir -p release-assets
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp desktop/src-tauri/target/release/bundle/nsis/*.exe release-assets/kspr-windows-x64.exe
          else
            cp desktop/src-tauri/target/release/bundle/deb/*.deb release-assets/kspr-linux-x64.deb
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kspr-${{ matrix.os }}
          path: release-assets/**
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: release }
      - name: Create checksums
        shell: bash
        run: find release -type f \( -name '*.deb' -o -name '*.exe' \) -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/kspr-linux-x64.deb
            release/**/kspr-windows-x64.exe
            release/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true